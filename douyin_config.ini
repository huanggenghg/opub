# 抖音上传配置文件
# 修改此文件后直接运行 python examples/upload_to_douyin.py 即可

[douyin]
# ============ 账号配置 ============
# Cookie 文件路径（默认即可，登录后会自动生成）
account_file = cookies/douyin_uploader/account.json

# ============ 视频上传配置 ============
# 视频文件路径（相对于项目根目录）
video_file = videos/demo.mp4

# 视频标题（最多30个字）
title = 男子为了心爱之人每天坚守

# 话题标签（用英文逗号分隔）
tags = 坚持不懈,爱情执着,奋斗使者,短视频

# 视频描述（可选，不填则使用标题）
description =

# 封面图片（可选，不填则使用平台自动生成的封面）
thumbnail_landscape =
thumbnail_portrait =

# ============ 发布配置 ============
# 发布策略: immediate=立即发布, scheduled=定时发布
publish_strategy = immediate

# 定时发布时间（仅当 publish_strategy = scheduled 时生效）
# 格式: YYYY-MM-DD HH:MM，如 2026-05-01 12:00
publish_time =

# ============ 图文上传配置 ============
# 是否上传图文（true/false）
upload_note = false

# 图文图片路径（用英文逗号分隔，仅当 upload_note = true 时生效）
note_images = videos/demo.png,videos/demo.png

# 图文内容
note_content = 图文内容示例

# 图文话题标签（用英文逗号分隔）
note_tags = 图文,示例,抖音图文
