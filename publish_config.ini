# 多平台统一发布配置文件
# 修改此文件后运行 python publish_all.py 即可一键发布到多个平台

[common]
# ============ 内容类型 ============
# content_type: note=图文, video=视频
content_type = video

# ============ 图文转视频配置 ============
# 将图文转为视频发布（仅当 content_type = note 时生效）
convert_to_video = false

# 每张图片显示时长（秒）
video_duration = 5

# ============ 内容配置（所有平台共用） ============
# 标题
title =

# 描述内容，支持\n换行
desc =

# 话题标签（用英文逗号分隔）
tags = 追觅电视, 追觅显示器, 追觅智能电视, 追觅AI电视

# ============ 文件路径 ============
# 视频文件路径（相对于项目根目录，仅视频模式需要）
video_file = videos/20260512/

# 图文图片路径（用英文逗号分隔，仅图文模式需要）
images =

# ============ 发布配置 ============
# 发布策略: immediate=立即发布, scheduled=定时发布
publish_strategy = immediate

# 定时发布时间（仅当 publish_strategy = scheduled 时生效）
# 格式: YYYY-MM-DD HH:MM，如 2026-05-01 12:00
publish_time =

# 起始视频序号（用于断点续传，从第几个视频开始发布）
start_from = 16 

[platforms]
# ============ 启用平台 ============
# 启用的平台（用英文逗号分隔）
# 可选: douyin, xiaohongshu, kuaishou, bilibili, tencent, baijiahao, tk, weibo
enabled = xiaohongshu, kuaishou, weibo

# ============ 各平台账号文件 ============
# 默认路径，通常不需要修改
douyin_account = cookies/douyin_uploader/account.json
xiaohongshu_account = cookies/xiaohongshu_uploader/account.json
kuaishou_account = ks_uploader/cookies/ks_uploader/account.json
bilibili_account = cookies/bilibili_uploader/account.json
tencent_account = cookies/tencent_uploader/account.json
baijiahao_account = cookies/baijiahao_uploader/account.json
tk_account = cookies/tk_uploader/account.json
weibo_account = cookies/weibo_uploader/account.json
