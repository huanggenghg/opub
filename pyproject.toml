[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hgeng-sau"
version = "0.2.1"
description = "Social media auto uploader"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "hgeng", email = "huanggenghg@gmail.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
keywords = ["social-media", "auto-upload", "video", "douyin", "xiaohongshu", "kuaishou", "weibo"]
dependencies = [
  "loguru>=0.7.3",
  "opencv-python>=4.13.0",
  "patchright>=1.52.0",
  "qrcode>=8.0",
  "requests>=2.32.3",
  "segno>=1.6.6",
  "xhs>=0.2.13",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/huanggenghg/social-auto-upload"
Repository = "https://github.com/huanggenghg/social-auto-upload"
Issues = "https://github.com/huanggenghg/social-auto-upload/issues"

[project.scripts]
sau = "sau_cli:main"

[project.optional-dependencies]
analyze = ["zhipuai>=2.0.0"]
web = [
  "Flask[async]>=3.1",
  "flask-cors>=6.0",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["conf", "sau_cli"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uploader*", "utils*", "myUtils*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]
