# 小红书上传配置文件
# 修改此文件后直接运行 python examples/upload_video_to_xiaohongshu.py 即可

[xiaohongshu]
# ============ 账号配置 ============
# Cookie 文件路径（默认即可，登录后会自动生成）
account_file = cookies/xiaohongshu_uploader/account.json

# ============ 视频上传配置 ============
# 视频文件路径（相对于项目根目录）
video_file = videos/demo.mp4

# 视频标题
title = 小红书视频示例

# 视频描述
desc = 视频描述内容

# 话题标签（用英文逗号分隔）
tags = 小红书,视频示例,自动上传

# 封面图片（可选，不填则使用平台自动生成的封面）
thumbnail =

# ============ 发布配置 ============
# 发布策略: immediate=立即发布, scheduled=定时发布
publish_strategy = immediate

# 定时发布时间（仅当 publish_strategy = scheduled 时生效）
# 格式: YYYY-MM-DD HH:MM，如 2026-05-01 12:00
publish_time =

# ============ 图文上传配置 ============
# 是否上传图文（true/false）
upload_note = true

# 图文图片路径（用英文逗号分隔，仅当 upload_note = true 时生效）
note_images = videos/0430-1-a.png,videos/0430-1-b.png

# 图文标题
note_title = ""

# 图文内容
note_content = 这几天刷科技圈，有点被一台电视刷屏了。​\n\n追觅刚在硅谷搞了个持续四天的发布会，规模不小，现场媒体和业内人基本都在聊R8000F这台“变形电视”。说实话，一开始我以为又是堆参数，结果看下来思路还挺不一样的——它那个“动态声擎”是真的会跟着人动，等于把电视从一个固定设备，变成会“感知你”的东西。​\n\n​还有S100，把整套Soundbar直接做到电视里，连外接音响这一步都省了。​\n\n现在的感觉就是，这不是单纯发了两台新电视，而是换了一种做电视的思路。难怪这两天在硅谷讨论度这么高。

# 图文话题标签（用英文逗号分隔）
note_tags = 追觅电视,追觅AI电视
